<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicAI — Smart City Command Center</title>
    <meta name="description" content="AI-Powered Smart City Complaint & Issue Prediction Platform" />

    <!-- Leaflet CSS (required for the city map to display correctly) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />

    <!-- Google Fonts: Rajdhani (headings) + Outfit (body) -->
    <!-- Why these fonts? Rajdhani looks military/tech — perfect for a command center.
         Outfit is modern, clean, and very readable for body text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent flash of unstyled content before React loads */
      body {
        background-color: #020B18;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- React will "inject" our entire app into this div -->
    <div id="root"></div>

    <!-- This is our React entry point. Vite compiles it. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
